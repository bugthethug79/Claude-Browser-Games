<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minefield</title>
<style>
  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --text: #1d2433;
    --muted: #6b7489;
    --hidden: #9fb4d3;
    --hidden-hi: #b6c8e3;
    --open: #f7f9fc;
    --open-line: #dfe5ee;
    --accent: #2f6fed;
    --boom: #ff5d5d;
    --n1: #2f6fed; --n2: #1f9d55; --n3: #e0412b; --n4: #6a3fc9;
    --n5: #b5541c; --n6: #128a8a; --n7: #333; --n8: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b2029; --text: #e7ebf3; --muted: #8a93a6;
      --hidden: #3b4a66; --hidden-hi: #4a5c7e; --open: #1f2530; --open-line: #2a313e;
      --n1: #6fa0ff; --n2: #5fd28d; --n3: #ff7a66; --n4: #b896ff;
      --n5: #f0a065; --n6: #4fd1d1; --n7: #ddd; --n8: #999;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  h1 { margin: 4px 0 12px; font-size: 24px; letter-spacing: 1px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    background: var(--panel); padding: 10px 12px; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 12px; max-width: 100%;
  }
  .stat { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 64px; text-align: center; }
  .stat small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  select, button {
    font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--open-line); background: var(--open); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--boom); color: #fff; border-color: var(--boom); }
  #custom { display: none; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  #custom.show { display: flex; }
  #custom input { width: 56px; font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--open-line); background: var(--open); color: var(--text); }
  #scroller { max-width: 100%; overflow: auto; border-radius: 10px; }
  #board {
    display: grid; gap: 2px; padding: 6px; background: var(--panel); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); user-select: none; -webkit-user-select: none;
    touch-action: manipulation; width: max-content;
  }
  .c {
    width: var(--sz); height: var(--sz); border-radius: 4px;
    background: var(--hidden); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: calc(var(--sz) * 0.58); line-height: 1; cursor: pointer;
    transition: background .08s;
  }
  .c.h:hover { background: var(--hidden-hi); }
  .c.o { background: var(--open); box-shadow: inset 0 0 0 1px var(--open-line); cursor: default; }
  .c.boom { background: var(--boom) !important; }
  .c.wrong { opacity: .5; text-decoration: line-through; }
  .c.pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
  .n1 { color: var(--n1); } .n2 { color: var(--n2); } .n3 { color: var(--n3); } .n4 { color: var(--n4); }
  .n5 { color: var(--n5); } .n6 { color: var(--n6); } .n7 { color: var(--n7); } .n8 { color: var(--n8); }
  #msg { min-height: 24px; margin-top: 12px; font-weight: 600; text-align: center; }
  .help { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; max-width: 520px; }
</style>
</head>
<body>
<h1>💣 Minefield</h1>
<div class="bar">
  <div class="stat"><small>MINES</small><span id="mines">0</span></div>
  <select id="diff">
    <option value="easy">Easy · 9×9</option>
    <option value="medium" selected>Medium · 16×16</option>
    <option value="hard">Hard · 30×16</option>
    <option value="custom">Custom…</option>
  </select>
  <span id="custom">
    W <input id="cw" type="number" min="5" max="50" value="20">
    H <input id="ch" type="number" min="5" max="30" value="12">
    💣 <input id="cm" type="number" min="1" max="999" value="40">
  </span>
  <button class="primary" id="newBtn">New game</button>
  <button id="flagBtn" title="Tap mode: reveal or flag">⛏ Dig</button>
  <div class="stat"><small>TIME</small><span id="time">0</span></div>
</div>
<div id="scroller"><div id="board"></div></div>
<div id="msg"></div>
<div class="help">
  Left-click to dig · right-click to flag · click a number whose flags are all placed to clear around it.<br>
  On touch: tap to dig, long-press to flag, or switch the mode button to 🚩 Flag. First dig is always safe.<br>
  <span id="bestLine"></span>
</div>

<script>
(() => {
  const PRESETS = { easy: [9, 9, 10], medium: [16, 16, 40], hard: [30, 16, 99] };
  const $ = id => document.getElementById(id);
  const board = $('board');

  let W, H, M, cells, els, started, over, revealedCount, flags, timer, t0, elapsed, flagMode = false;

  function bestKey() { return 'minefield-best-' + $('diff').value; }
  function getBest() { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } }
  function setBest(v) { try { localStorage.setItem(bestKey(), v); } catch (e) {} }
  function showBest() {
    const b = getBest();
    $('bestLine').textContent = b && $('diff').value !== 'custom' ? `Best time on this difficulty: ${b}s` : '';
  }

  function config() {
    const d = $('diff').value;
    if (d !== 'custom') return PRESETS[d];
    const w = clamp(+$('cw').value || 9, 5, 50), h = clamp(+$('ch').value || 9, 5, 30);
    const m = clamp(+$('cm').value || 10, 1, w * h - 9);
    $('cw').value = w; $('ch').value = h; $('cm').value = m;
    return [w, h, m];
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function newGame() {
    [W, H, M] = config();
    cells = Array.from({ length: W * H }, () => ({ mine: false, n: 0, open: false, flag: false }));
    started = false; over = false; revealedCount = 0; flags = 0; elapsed = 0;
    clearInterval(timer);
    $('time').textContent = 0;
    $('msg').textContent = '';
    updateMines();
    showBest();

    const avail = Math.min(window.innerWidth - 32, 900);
    const sz = clamp(Math.floor((avail - 12) / W) - 2, 22, 36);
    board.style.setProperty('--sz', sz + 'px');
    board.style.gridTemplateColumns = `repeat(${W}, ${sz}px)`;
    board.innerHTML = '';
    els = cells.map((_, i) => {
      const d = document.createElement('div');
      d.className = 'c h';
      d.dataset.i = i;
      board.appendChild(d);
      return d;
    });
  }

  const neighbors = i => {
    const x = i % W, y = (i / W) | 0, out = [];
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H) out.push(ny * W + nx);
      }
    return out;
  };

  function placeMines(safe) {
    const forbidden = new Set([safe, ...neighbors(safe)]);
    // On tiny dense boards, fall back to only protecting the clicked cell
    if (W * H - forbidden.size < M) forbidden.clear(), forbidden.add(safe);
    const pool = [];
    for (let i = 0; i < W * H; i++) if (!forbidden.has(i)) pool.push(i);
    for (let k = 0; k < M; k++) {
      const j = k + Math.floor(Math.random() * (pool.length - k));
      [pool[k], pool[j]] = [pool[j], pool[k]];
      cells[pool[k]].mine = true;
    }
    cells.forEach((c, i) => { c.n = neighbors(i).filter(j => cells[j].mine).length; });
  }

  function startTimer() {
    t0 = Date.now();
    timer = setInterval(() => {
      elapsed = Math.floor((Date.now() - t0) / 1000);
      $('time').textContent = elapsed;
    }, 250);
  }

  function updateMines() { $('mines').textContent = M - flags; }

  function render(i, animate) {
    const c = cells[i], el = els[i];
    el.className = 'c ' + (c.open ? 'o' : 'h');
    el.textContent = '';
    if (c.open) {
      if (c.mine) el.textContent = '💣';
      else if (c.n) { el.textContent = c.n; el.classList.add('n' + c.n); }
      if (animate) el.classList.add('pop');
    } else if (c.flag) el.textContent = '🚩';
  }

  function reveal(start) {
    const stack = [start];
    while (stack.length) {
      const i = stack.pop(), c = cells[i];
      if (c.open || c.flag) continue;
      c.open = true; revealedCount++;
      render(i, true);
      if (c.mine) return boom(i);
      if (c.n === 0) for (const j of neighbors(i)) if (!cells[j].open && !cells[j].flag) stack.push(j);
    }
    if (revealedCount === W * H - M) win();
  }

  function dig(i) {
    if (over) return;
    const c = cells[i];
    if (!started) { placeMines(i); started = true; startTimer(); }
    if (c.open) return chord(i);
    if (c.flag) return;
    reveal(i);
  }

  function chord(i) {
    const c = cells[i];
    if (!c.n) return;
    const ns = neighbors(i);
    const f = ns.filter(j => cells[j].flag).length;
    if (f !== c.n) {
      ns.forEach(j => { if (!cells[j].open && !cells[j].flag) { els[j].style.outline = '2px solid var(--accent)'; setTimeout(() => els[j].style.outline = '', 180); } });
      return;
    }
    for (const j of ns) { if (over) return; if (!cells[j].open && !cells[j].flag) reveal(j); }
  }

  function toggleFlag(i) {
    if (over) return;
    const c = cells[i];
    if (c.open) return chord(i);
    c.flag = !c.flag;
    flags += c.flag ? 1 : -1;
    updateMines();
    render(i);
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function boom(i) {
    over = true;
    clearInterval(timer);
    els[i].classList.add('boom');
    cells.forEach((c, j) => {
      if (c.mine && !c.flag && !c.open) { c.open = true; render(j); }
      else if (!c.mine && c.flag) { els[j].classList.add('wrong'); }
    });
    $('msg').textContent = '💥 Boom! Click “New game” to try again.';
  }

  function win() {
    over = true;
    clearInterval(timer);
    elapsed = Math.max(1, Math.round((Date.now() - t0) / 1000));
    $('time').textContent = elapsed;
    cells.forEach((c, j) => { if (c.mine && !c.flag) { c.flag = true; render(j); } });
    flags = M; updateMines();
    let extra = '';
    if ($('diff').value !== 'custom') {
      const b = getBest();
      if (!b || elapsed < b) { setBest(elapsed); extra = ' New best time!'; }
      showBest();
    }
    $('msg').textContent = `🎉 Cleared in ${elapsed}s.${extra}`;
  }

  // ---------- input ----------
  let pressTimer = null, longPressed = false, touchActive = false;

  board.addEventListener('contextmenu', e => e.preventDefault());

  board.addEventListener('mousedown', e => {
    if (touchActive) return;
    const el = e.target.closest('.c'); if (!el) return;
    const i = +el.dataset.i;
    if (e.button === 2) toggleFlag(i);
    else if (e.button === 1) { e.preventDefault(); if (cells[i].open) chord(i); }
    else if (e.button === 0) flagMode ? toggleFlag(i) : dig(i);
  });

  board.addEventListener('touchstart', e => {
    touchActive = true;
    const el = e.target.closest('.c'); if (!el) return;
    const i = +el.dataset.i;
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; flagMode ? dig(i) : toggleFlag(i); }, 380);
  }, { passive: true });
  board.addEventListener('touchmove', () => clearTimeout(pressTimer), { passive: true });
  board.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    const el = e.target.closest('.c');
    if (el && !longPressed) { e.preventDefault(); const i = +el.dataset.i; flagMode ? toggleFlag(i) : dig(i); }
    setTimeout(() => touchActive = false, 600);
  });

  $('flagBtn').addEventListener('click', () => {
    flagMode = !flagMode;
    $('flagBtn').textContent = flagMode ? '🚩 Flag' : '⛏ Dig';
    $('flagBtn').classList.toggle('on', flagMode);
  });
  $('newBtn').addEventListener('click', newGame);
  $('diff').addEventListener('change', () => {
    $('custom').classList.toggle('show', $('diff').value === 'custom');
    newGame();
  });
  ['cw', 'ch', 'cm'].forEach(id => $(id).addEventListener('change', newGame));
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'n' || e.key === 'N' || e.key === 'F2') newGame(); });

  newGame();
})();
</script>
</body>
</html>
