<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake Plus</title>
<style>
  :root {
    --bg: #0d1512;
    --panel: #15211c;
    --line: #22362d;
    --text: #e6f5ec;
    --muted: #84a594;
    --accent: #5cf28f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #18291f, var(--bg) 70%);
    color: var(--text); font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  header { display: flex; gap: 18px; align-items: center; margin: 12px 0 8px; padding: 0 16px; flex-wrap: wrap; justify-content: center; }
  h1 { margin: 0; font-size: 22px; color: var(--accent); letter-spacing: 2px; }
  .stat { font-variant-numeric: tabular-nums; font-weight: 700; }
  .stat small { color: var(--muted); font-weight: 600; margin-right: 4px; font-size: 11px; letter-spacing: 1px; }
  #effects { display: flex; gap: 6px; min-height: 26px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .fx { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 13px; position: relative; overflow: hidden; }
  .fx .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }
  #stage { position: relative; }
  canvas { display: block; border-radius: 10px; border: 2px solid var(--line); }
  #overlay {
    position: absolute; inset: 0; background: rgba(8, 14, 11, 0.9); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; text-align: center; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; color: var(--accent); font-size: 26px; }
  #overlay p { margin: 0; color: var(--muted); font-size: 13px; }
  .opts { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; text-align: left; font-size: 13px; }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button {
    font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
  }
  .seg button.sel { background: var(--accent); color: #062312; border-color: var(--accent); font-weight: 700; }
  .go {
    font: inherit; font-weight: 800; font-size: 16px; padding: 10px 28px; border-radius: 10px; border: 0;
    background: var(--accent); color: #062312; cursor: pointer; margin-top: 4px;
  }
  .legend { font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 380px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; padding: 0 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>SNAKE+</h1>
  <div class="stat"><small>SCORE</small><span id="score">0</span></div>
  <div class="stat"><small>LENGTH</small><span id="len">3</span></div>
  <div class="stat"><small>BEST</small><span id="best">0</span></div>
</header>
<div id="effects"></div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">Snake+</h2>
    <p id="ovText">Pick your modifiers, then go.</p>
    <div class="opts" id="opts"></div>
    <button class="go" id="goBtn">Start</button>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="hint">Arrows / WASD to steer · Space or P to pause · swipe on touch screens</div>

<script>
(() => {
  const N = 24; // grid size
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let CELL = 22;

  // ---------- modifiers ----------
  const OPTIONS = {
    speed:     { label: 'Speed',     choices: ['Chill', 'Normal', 'Fast', 'Insane'], def: 1 },
    walls:     { label: 'Walls',     choices: ['Solid', 'Wrap'], def: 0 },
    obstacles: { label: 'Obstacles', choices: ['None', 'Few', 'Many', 'Maze'], def: 0 },
    food:      { label: 'Food',      choices: ['1', '3', '5'], def: 0 },
    powerups:  { label: 'Power-ups', choices: ['Off', 'On', 'Chaos'], def: 1 },
    portals:   { label: 'Portals',   choices: ['Off', 'On'], def: 0 },
    accel:     { label: 'Speed-up',  choices: ['Off', 'On'], def: 1 },
  };
  const settings = {};
  try { Object.assign(settings, JSON.parse(localStorage.getItem('snakeplus-settings') || '{}')); } catch (e) {}
  for (const k in OPTIONS) if (!(settings[k] >= 0 && settings[k] < OPTIONS[k].choices.length)) settings[k] = OPTIONS[k].def;

  function buildOptions() {
    const box = $('opts');
    box.innerHTML = '';
    for (const k in OPTIONS) {
      const o = OPTIONS[k];
      const l = document.createElement('div'); l.textContent = o.label;
      const seg = document.createElement('div'); seg.className = 'seg';
      o.choices.forEach((c, i) => {
        const b = document.createElement('button');
        b.textContent = c;
        if (settings[k] === i) b.classList.add('sel');
        b.onclick = () => {
          settings[k] = i;
          try { localStorage.setItem('snakeplus-settings', JSON.stringify(settings)); } catch (e) {}
          buildOptions();
        };
        seg.appendChild(b);
      });
      box.append(l, seg);
    }
  }

  // ---------- power-ups ----------
  const POWERS = {
    gold:    { icon: '🌟', name: 'Golden',  color: '#ffd84d', dur: 0,    desc: '+50 points, +3 length' },
    speed:   { icon: '⚡', name: 'Turbo',   color: '#ffef5c', dur: 6000, desc: 'faster, points ×1.5' },
    slow:    { icon: '🐢', name: 'Slow-mo', color: '#7fd1ff', dur: 7000, desc: 'slows time down' },
    ghost:   { icon: '👻', name: 'Ghost',   color: '#c6b7ff', dur: 6000, desc: 'pass through walls, rocks & yourself' },
    shrink:  { icon: '✂️', name: 'Shrink',  color: '#ff9ec7', dur: 0,    desc: 'lose a third of your length' },
    magnet:  { icon: '🧲', name: 'Magnet',  color: '#ff6b6b', dur: 8000, desc: 'pulls food toward you' },
    double:  { icon: '✖️', name: 'Double',  color: '#5cf28f', dur: 10000, desc: 'double points' },
    reverse: { icon: '🔄', name: 'Reverse', color: '#ffa94d', dur: 0,    desc: 'head and tail swap — careful!' },
    bomb:    { icon: '💥', name: 'Blast',   color: '#ff8c42', dur: 0,    desc: 'destroys nearby obstacles' },
  };
  const POWER_KEYS = Object.keys(POWERS);

  $('legend').innerHTML = '🍎 food · ' + POWER_KEYS.map(k => `${POWERS[k].icon} ${POWERS[k].name}`).join(' · ');

  // ---------- state ----------
  let snake, dir, dirQueue, foods, items, rocks, portals, effects, score, state = 'menu';
  let tickAcc, particles, floaters, nextItemIn, growPending, shake;
  let best = 0;
  try { best = +localStorage.getItem('snakeplus-best') || 0; } catch (e) {}
  $('best').textContent = best;

  const key = (x, y) => y * N + x;
  const rand = n => Math.floor(Math.random() * n);

  function occupied(x, y) {
    if (snake.some(s => s.x === x && s.y === y)) return true;
    if (rocks.has(key(x, y))) return true;
    if (foods.some(f => f.x === x && f.y === y)) return true;
    if (items.some(f => f.x === x && f.y === y)) return true;
    if (portals.some(p => p.x === x && p.y === y)) return true;
    return false;
  }
  function freeCell(minDistFromHead = 0) {
    for (let tries = 0; tries < 2000; tries++) {
      const x = rand(N), y = rand(N);
      if (occupied(x, y)) continue;
      if (minDistFromHead && snake.length && Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < minDistFromHead) continue;
      return { x, y };
    }
    return null;
  }

  function buildRocks() {
    rocks = new Set();
    const mode = settings.obstacles;
    const safe = (x, y) => y === Math.floor(N / 2) || (Math.abs(x - 6) < 4 && Math.abs(y - N / 2) < 3);
    if (mode === 1 || mode === 2) {
      const clusters = mode === 1 ? 5 : 11;
      for (let c = 0; c < clusters; c++) {
        let x = rand(N), y = rand(N);
        const len = 2 + rand(4), horiz = Math.random() < 0.5;
        for (let i = 0; i < len; i++) {
          const rx = horiz ? x + i : x, ry = horiz ? y : y + i;
          if (rx < N && ry < N && !safe(rx, ry)) rocks.add(key(rx, ry));
        }
      }
    } else if (mode === 3) {
      // maze-ish: border box with gaps + inner pillars
      for (let i = 3; i < N - 3; i++) {
        if (Math.abs(i - N / 2) > 2) {
          rocks.add(key(i, 3)); rocks.add(key(i, N - 4));
          rocks.add(key(3, i)); rocks.add(key(N - 4, i));
        }
      }
      for (let y = 7; y < N - 7; y += 4)
        for (let x = 8; x < N - 7; x += 4)
          if (!safe(x, y)) { rocks.add(key(x, y)); rocks.add(key(x + 1, y)); }
    }
  }

  function newGame() {
    const mid = Math.floor(N / 2);
    snake = [{ x: 6, y: mid }, { x: 5, y: mid }, { x: 4, y: mid }];
    dir = { x: 1, y: 0 }; dirQueue = [];
    foods = []; items = []; portals = []; effects = {};
    particles = []; floaters = []; shake = 0;
    score = 0; growPending = 0; tickAcc = 0;
    buildRocks();
    if (settings.portals) {
      const a = freeCell(6), b = a && (portals.push({ ...a, c: 0 }), freeCell(6));
      if (b) portals.push({ ...b, c: 1 });
      if (portals.length < 2) portals = [];
    }
    const nf = [1, 3, 5][settings.food];
    for (let i = 0; i < nf; i++) spawnFood();
    nextItemIn = 4000 + Math.random() * 4000;
    state = 'play';
    $('overlay').classList.add('hidden');
    hud();
  }

  function spawnFood() { const c = freeCell(3); if (c) foods.push(c); }
  function spawnItem() {
    const c = freeCell(4);
    if (!c) return;
    let pool = POWER_KEYS;
    if (!rocks.size) pool = pool.filter(k => k !== 'bomb');
    const type = pool[rand(pool.length)];
    items.push({ ...c, type, ttl: 9000, life: 9000 });
  }

  function tickMs() {
    let base = [150, 110, 78, 52][settings.speed];
    if (settings.accel) base *= Math.max(0.55, 1 - (snake.length - 3) * 0.012);
    if (effects.speed) base *= 0.6;
    if (effects.slow) base *= 1.7;
    return base;
  }

  function multiplier() { return (effects.double ? 2 : 1) * (effects.speed ? 1.5 : 1) * (1 + settings.speed * 0.25); }

  function addScore(base, x, y, color = '#5cf28f') {
    const pts = Math.round(base * multiplier());
    score += pts;
    floaters.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL, text: '+' + pts, t: 0, color });
    hud();
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
      particles.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 400 + Math.random() * 300, color });
    }
  }

  function hud() {
    $('score').textContent = score;
    $('len').textContent = snake.length;
    if (score > best) { best = score; $('best').textContent = best; }
  }

  function step() {
    // direction input
    while (dirQueue.length) {
      const d = dirQueue.shift();
      if (d.x === -dir.x && d.y === -dir.y) continue;
      if (d.x === dir.x && d.y === dir.y) continue;
      dir = d; break;
    }

    const head = snake[0];
    let nx = head.x + dir.x, ny = head.y + dir.y;
    const wrap = settings.walls === 1 || effects.ghost;
    if (nx < 0 || nx >= N || ny < 0 || ny >= N) {
      if (!wrap) return die();
      nx = (nx + N) % N; ny = (ny + N) % N;
    }

    // portals
    const pIdx = portals.findIndex(p => p.x === nx && p.y === ny);
    if (pIdx >= 0) {
      const o = portals[1 - pIdx];
      burst(nx, ny, '#b77dff', 8);
      nx = o.x; ny = o.y;
      burst(nx, ny, '#4dd6ff', 8);
    }

    if (!effects.ghost) {
      if (rocks.has(key(nx, ny))) return die();
      // tail moves away this tick unless growing
      const body = growPending > 0 ? snake : snake.slice(0, -1);
      if (body.some(s => s.x === nx && s.y === ny)) return die();
    }

    snake.unshift({ x: nx, y: ny });
    if (growPending > 0) growPending--; else snake.pop();

    // eat food
    const fi = foods.findIndex(f => f.x === nx && f.y === ny);
    if (fi >= 0) {
      foods.splice(fi, 1);
      growPending += 1;
      addScore(10, nx, ny);
      burst(nx, ny, '#ff5a5a');
      spawnFood();
      if (settings.food === 0 && foods.length === 0) spawnFood();
    }

    // pick up item
    const ii = items.findIndex(f => f.x === nx && f.y === ny);
    if (ii >= 0) {
      const it = items.splice(ii, 1)[0];
      applyPower(it.type, nx, ny);
    }

    // magnet: pull food one step toward head
    if (effects.magnet) {
      for (const f of foods) {
        const dx = Math.sign(nx - f.x), dy = Math.sign(ny - f.y);
        const dist = Math.abs(nx - f.x) + Math.abs(ny - f.y);
        if (dist > 10 || dist <= 1) continue;
        const tx = Math.abs(nx - f.x) >= Math.abs(ny - f.y) ? f.x + dx : f.x;
        const ty = tx === f.x ? f.y + dy : f.y;
        if (!rocks.has(key(tx, ty)) && !snake.some(s => s.x === tx && s.y === ty) && !foods.some(o => o !== f && o.x === tx && o.y === ty)) {
          f.x = tx; f.y = ty;
        }
      }
    }
    hud();
  }

  function applyPower(type, x, y) {
    const p = POWERS[type];
    burst(x, y, p.color, 18);
    floaters.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL - 14, text: p.name + '!', t: 0, color: p.color });
    switch (type) {
      case 'gold': growPending += 3; addScore(50, x, y, p.color); break;
      case 'shrink': {
        const cut = Math.floor(snake.length / 3);
        const keep = Math.max(3, snake.length - cut);
        snake.slice(keep).forEach(s => burst(s.x, s.y, '#ff9ec7', 3));
        snake.length = keep; growPending = 0;
        addScore(15, x, y, p.color);
        break;
      }
      case 'reverse': {
        const oldDir = dir;
        snake.reverse();
        if (snake.length > 1) {
          dir = { x: snake[0].x - snake[1].x, y: snake[0].y - snake[1].y };
          if (Math.abs(dir.x) > 1) dir.x = -Math.sign(dir.x);
          if (Math.abs(dir.y) > 1) dir.y = -Math.sign(dir.y);
        }
        if (Math.abs(dir.x) + Math.abs(dir.y) !== 1) dir = oldDir.x || oldDir.y ? { x: -oldDir.x, y: -oldDir.y } : { x: 1, y: 0 };
        dirQueue = [];
        addScore(25, x, y, p.color);
        break;
      }
      case 'bomb': {
        for (let dy = -4; dy <= 4; dy++)
          for (let dx = -4; dx <= 4; dx++) {
            const rx = x + dx, ry = y + dy, k = key(rx, ry);
            if (rx >= 0 && rx < N && ry >= 0 && ry < N && rocks.has(k)) { rocks.delete(k); burst(rx, ry, '#ff8c42', 5); }
          }
        shake = 250;
        addScore(20, x, y, p.color);
        break;
      }
      default:
        if (type === 'speed') delete effects.slow;
        if (type === 'slow') delete effects.speed;
        effects[type] = { left: p.dur, dur: p.dur };
        addScore(5, x, y, p.color);
    }
  }

  function die() {
    state = 'over';
    shake = 350;
    snake.forEach((s, i) => setTimeout(() => burst(s.x, s.y, '#5cf28f', 4), i * 15));
    try { localStorage.setItem('snakeplus-best', best); } catch (e) {}
    setTimeout(() => {
      $('ovTitle').textContent = 'Game Over';
      $('ovText').textContent = `Score ${score} · Length ${snake.length}`;
      $('goBtn').textContent = 'Play again';
      buildOptions();
      $('overlay').classList.remove('hidden');
    }, 700);
  }

  function togglePause() {
    if (state === 'play') {
      state = 'paused';
      $('ovTitle').textContent = 'Paused';
      $('ovText').textContent = 'Press Space to resume (changing modifiers starts a new game).';
      $('goBtn').textContent = 'Resume';
      buildOptions();
      $('overlay').classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'play';
      $('overlay').classList.add('hidden');
    }
  }

  let settingsAtPause = null;
  $('goBtn').addEventListener('click', () => {
    if (state === 'paused' && JSON.stringify(settings) === settingsAtPause) togglePause();
    else newGame();
  });

  // ---------- input ----------
  const DIRS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };
  function queueDir(x, y) {
    if (state !== 'play') return;
    const lastD = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if ((x === lastD.x && y === lastD.y) || (x === -lastD.x && y === -lastD.y)) return;
    if (dirQueue.length < 3) dirQueue.push({ x, y });
  }
  document.addEventListener('keydown', e => {
    if (DIRS[e.key]) { e.preventDefault(); queueDir(...DIRS[e.key]); return; }
    if (e.key === ' ' || e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      if (state === 'play') { settingsAtPause = JSON.stringify(settings); togglePause(); }
      else if (e.key !== 'Escape') $('goBtn').click();
      return;
    }
    if (e.key === 'Enter' && state !== 'play') $('goBtn').click();
  });

  let touchStart = null;
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const t = e.touches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) queueDir(Math.sign(dx), 0); else queueDir(0, Math.sign(dy));
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', () => touchStart = null);
  window.addEventListener('blur', () => { if (state === 'play') { settingsAtPause = JSON.stringify(settings); togglePause(); } });

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(100, now - last); last = now;
    if (state === 'play') {
      tickAcc += dt;
      let guard = 0;
      while (tickAcc >= tickMs() && state === 'play' && guard++ < 5) { tickAcc -= tickMs(); step(); }

      for (const k in effects) { effects[k].left -= dt; if (effects[k].left <= 0) delete effects[k]; }
      for (const it of items) it.ttl -= dt;
      items = items.filter(it => it.ttl > 0);

      if (settings.powerups) {
        nextItemIn -= dt;
        const maxItems = settings.powerups === 2 ? 4 : 1;
        if (nextItemIn <= 0) {
          if (items.length < maxItems) spawnItem();
          nextItemIn = settings.powerups === 2 ? 1500 + Math.random() * 2500 : 7000 + Math.random() * 6000;
        }
      }
      renderEffects();
    }
    for (const p of particles) { p.t += dt; p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.vx *= 0.96; p.vy *= 0.96; }
    particles = particles.filter(p => p.t < p.life);
    for (const f of floaters) f.t += dt;
    floaters = floaters.filter(f => f.t < 900);
    if (shake > 0) shake -= dt;
    draw(now);
    requestAnimationFrame(loop);
  }

  let lastFxHtml = '';
  function renderEffects() {
    const html = Object.keys(effects).map(k => {
      const e = effects[k], p = POWERS[k];
      return `<div class="fx">${p.icon} ${p.name} ${Math.ceil(e.left / 1000)}s<div class="bar" style="width:${(e.left / e.dur) * 100}%;background:${p.color}"></div></div>`;
    }).join('');
    if (html !== lastFxHtml) { $('effects').innerHTML = html; lastFxHtml = html; }
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(now) {
    const S = N * CELL;
    ctx.save();
    ctx.clearRect(0, 0, S, S);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

    // board
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++) {
        ctx.fillStyle = (x + y) % 2 ? '#13201a' : '#162519';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    if (settings.walls === 1 || (effects && effects.ghost)) {
      ctx.strokeStyle = 'rgba(92,242,143,0.25)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, S - 2, S - 2); ctx.setLineDash([]);
    }
    if (!snake) { ctx.restore(); return; }

    // rocks
    for (const k of rocks) {
      const x = k % N, y = (k / N) | 0;
      ctx.fillStyle = '#4b5a54';
      rr(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2, 4); ctx.fill();
      ctx.fillStyle = '#5f706a';
      rr(x * CELL + 3, y * CELL + 3, CELL - 8, CELL / 3, 3); ctx.fill();
    }

    // portals
    for (const p of portals) {
      const cx = (p.x + 0.5) * CELL, cy = (p.y + 0.5) * CELL;
      const col = p.c ? '#4dd6ff' : '#b77dff';
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = col; ctx.globalAlpha = 0.9 - i * 0.25; ctx.lineWidth = 2;
        ctx.beginPath();
        const a = now / 300 + i * 2;
        ctx.arc(cx, cy, CELL * (0.18 + i * 0.12), a, a + Math.PI * 1.4);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // food
    for (const f of foods) {
      const pulse = 1 + Math.sin(now / 200 + f.x) * 0.06;
      const cx = (f.x + 0.5) * CELL, cy = (f.y + 0.5) * CELL;
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath(); ctx.arc(cx, cy + 1, CELL * 0.36 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.arc(cx - CELL * 0.12, cy - CELL * 0.08, CELL * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6ad46a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy - CELL * 0.3); ctx.lineTo(cx + CELL * 0.12, cy - CELL * 0.45); ctx.stroke();
    }

    // items
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      const p = POWERS[it.type];
      const cx = (it.x + 0.5) * CELL, cy = (it.y + 0.5) * CELL;
      const blink = it.ttl < 2500 && Math.floor(it.ttl / 150) % 2;
      if (blink) continue;
      ctx.fillStyle = p.color + '33';
      ctx.beginPath(); ctx.arc(cx, cy, CELL * (0.5 + Math.sin(now / 180) * 0.06), 0, Math.PI * 2); ctx.fill();
      ctx.font = `${Math.round(CELL * 0.75)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(p.icon, cx, cy + 1);
    }

    // snake
    const ghost = effects.ghost;
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(1, len - 1);
      let col;
      if (effects.speed) col = `hsl(${55 - t * 20}, 95%, ${62 - t * 18}%)`;
      else if (effects.double) col = `hsl(${(now / 8 + i * 18) % 360}, 80%, 60%)`;
      else col = `hsl(${140 - t * 25}, 75%, ${58 - t * 22}%)`;
      ctx.globalAlpha = ghost ? 0.45 + Math.sin(now / 120) * 0.15 : 1;
      ctx.fillStyle = col;
      const pad = i === 0 ? 1 : 2 + t * 2;
      rr(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, CELL * 0.3);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // eyes
    const h = snake[0];
    const hx = (h.x + 0.5) * CELL, hy = (h.y + 0.5) * CELL;
    const px = -dir.y, py = dir.x;
    for (const side of [-1, 1]) {
      const ex = hx + dir.x * CELL * 0.15 + px * side * CELL * 0.2;
      const ey = hy + dir.y * CELL * 0.15 + py * side * CELL * 0.2;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, CELL * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0b1a10'; ctx.beginPath(); ctx.arc(ex + dir.x * CELL * 0.05, ey + dir.y * CELL * 0.05, CELL * 0.065, 0, Math.PI * 2); ctx.fill();
    }

    // magnet aura
    if (effects.magnet) {
      ctx.strokeStyle = 'rgba(255,107,107,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hx, hy, CELL * (1.2 + (now % 600) / 600 * 1.5), 0, Math.PI * 2); ctx.stroke();
    }

    // particles & floaters
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.font = `800 ${Math.round(CELL * 0.6)}px ui-rounded, system-ui, sans-serif`;
    for (const f of floaters) {
      ctx.globalAlpha = 1 - f.t / 900;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y - f.t / 30);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function resize() {
    const avail = Math.min(window.innerWidth - 32, window.innerHeight - 130);
    CELL = Math.max(12, Math.floor(avail / N));
    const dpr = window.devicePixelRatio || 1;
    cv.width = N * CELL * dpr; cv.height = N * CELL * dpr;
    cv.style.width = cv.style.height = N * CELL + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  buildOptions();
  rocks = new Set(); effects = {}; particles = []; floaters = []; shake = 0;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
